modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
showAsResourcePack=false

[[mods]]
modId="createnewagepatch"
version="${version}"
displayName="Create New Age Patch"
authors="Drak"
description='''
Server-side fix for the "must be Methodref constant" crash on datapack load.
Repairs interface super calls that Mixin rebinds incorrectly, such as
ElementalCraft's ItemStack mixin when ESL (Create: New Age 1.1.7+) is installed.
'''
# Server-side only: clients do not need this mod to join.
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.createnewagepatch]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="SERVER"

[[dependencies.createnewagepatch]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1]"
    ordering="NONE"
    side="SERVER"
